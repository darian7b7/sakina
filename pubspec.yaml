name: sakina
description: "Quran reminders by category, fully offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  family_ui:
    path: ../family_kit/family_ui
  family_reminders:
    path: ../family_kit/family_reminders
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ayat.json
